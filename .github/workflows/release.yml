name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOODMEMORY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install sqlite-vss Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libatlas-base-dev liblapack-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gate (v0.7 readiness)
        env:
          GOODMEMORY_ASSISTED_EXTRACTOR_API_KEY: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_API_KEY }}
          GOODMEMORY_ASSISTED_EXTRACTOR_BASE_URL: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_BASE_URL }}
          GOODMEMORY_ASSISTED_EXTRACTOR_MODEL: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_MODEL }}
          GOODMEMORY_ASSISTED_EXTRACTOR_PROVIDER: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_PROVIDER }}
          GOODMEMORY_TEST_POSTGRES_URL: ${{ secrets.GOODMEMORY_TEST_POSTGRES_URL || 'postgres://postgres:postgres@localhost:5432/postgres' }}
        run: bun run gate:v0.7 --strict --lifecycle-protection-artifact reports/release/v0.7/v0.7.3-lifecycle-protection.json

      - name: Pack release tarball
        id: pack
        run: |
          set -euo pipefail
          RELEASE_OUTPUT_DIR="$RUNNER_TEMP/goodmemory-v0-7-release"
          mkdir -p "$RELEASE_OUTPUT_DIR"
          VERSION="$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::Stable release workflow only supports stable semver versions, got $VERSION"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag version $TAG_VERSION does not match package.json version $VERSION"
              exit 1
            fi
          fi
          ARTIFACT_JSON="$(bun scripts/prepare-v0-7-stable-artifact.ts --output-dir "$RELEASE_OUTPUT_DIR")"
          ARTIFACT_PATH="$(ARTIFACT_JSON="$ARTIFACT_JSON" bun -e 'console.log(JSON.parse(process.env.ARTIFACT_JSON).artifactPath)')"
          ARTIFACT_INTEGRITY="$(ARTIFACT_JSON="$ARTIFACT_JSON" bun -e 'console.log(JSON.parse(process.env.ARTIFACT_JSON).integrity)')"
          ARTIFACT_SOURCE_COMMIT="$(ARTIFACT_JSON="$ARTIFACT_JSON" bun -e 'console.log(JSON.parse(process.env.ARTIFACT_JSON).sourceCommit)')"
          ARTIFACT_SOURCE_TREE="$(ARTIFACT_JSON="$ARTIFACT_JSON" bun -e 'console.log(JSON.parse(process.env.ARTIFACT_JSON).sourceTree)')"
          if [[ "$ARTIFACT_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Artifact source $ARTIFACT_SOURCE_COMMIT does not match workflow source $GITHUB_SHA"
            exit 1
          fi
          ARTIFACT_NAME="$(basename "$ARTIFACT_PATH")"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_integrity=$ARTIFACT_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "source_commit=$ARTIFACT_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_tree=$ARTIFACT_SOURCE_TREE" >> "$GITHUB_OUTPUT"
          {
            echo "## Release artifact"
            echo "- Version: $VERSION"
            echo "- Name: $ARTIFACT_NAME"
            echo "- Path: $ARTIFACT_PATH"
            echo "- Integrity: $ARTIFACT_INTEGRITY"
            echo "- Source commit: $ARTIFACT_SOURCE_COMMIT"
            echo "- Source tree: $ARTIFACT_SOURCE_TREE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact prepublish artifact
        id: prepublish
        run: |
          set -euo pipefail
          ARTIFACT_PATH="${{ steps.pack.outputs.artifact_path }}"
          ARTIFACT_INTEGRITY="${{ steps.pack.outputs.artifact_integrity }}"
          EVIDENCE_PATH="$(dirname "$ARTIFACT_PATH")/prepublish-evidence.json"
          EVIDENCE_JSON="$(bun scripts/verify-v0-7-release-artifact.ts \
            --artifact "$ARTIFACT_PATH" \
            --source-commit "${{ steps.pack.outputs.source_commit }}" \
            --source-tree "${{ steps.pack.outputs.source_tree }}" \
            --expected-integrity "$ARTIFACT_INTEGRITY")"
          printf '%s\n' "$EVIDENCE_JSON" > "$EVIDENCE_PATH"
          echo "evidence_path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"
          {
            echo "## Exact prepublish artifact verification"
            echo "- Source commit: ${{ steps.pack.outputs.source_commit }}"
            echo "- Source tree: ${{ steps.pack.outputs.source_tree }}"
            echo "- Evidence: $EVIDENCE_PATH"
            echo "- Integrity: $ARTIFACT_INTEGRITY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify full-claim protocol-v2 pass-one evidence
        run: |
          set -euo pipefail
          test -s reports/release/v0.7/v0.7.3-locomo-claim-evidence/seed-attempt-1-smoke-report.json
          test -s reports/release/v0.7/v0.7.3-locomo-claim-evidence/seed-attempt-1-live-progress.jsonl
          test -s reports/release/v0.7/v0.7.3-locomo-claim-evidence/seed-attempt-1-extraction-cache.jsonl

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: |
            ${{ steps.pack.outputs.artifact_path }}
            ${{ steps.prepublish.outputs.evidence_path }}
            reports/release/v0.7/v0.7.3-lifecycle-protection.json
            reports/release/v0.7/v0.7.3-lifecycle-schema9-attempt-consumed.json
            reports/release/v0.7/v0.7.3-lifecycle-schema9-evidence/**
            reports/release/v0.7/v0.7.3-full-claim-protocol2-preregistration.json
            reports/release/v0.7/v0.7.3-full-claim-protocol2-attempt-consumed.json
            reports/release/v0.7/v0.7.3-public-claim-governance-correction-preregistration.json
            reports/release/v0.7/v0.7.3-public-claim-governance-correction-attestation.json
            reports/release/v0.7/v0.7.3-stable-source-test-correction-preregistration.json
            reports/release/v0.7/v0.7.3-stable-source-test-correction-attestation.json
            reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-preregistration.json
            reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-attestation.json
            benchmark-claims/evidence/locomo-v0.7.3-current.json
            reports/release/v0.7/v0.7.3-locomo-claim-evidence/**
            reports/release/v0.7/phase-74-storage-scale-gate.json
            reports/release/v0.7/readiness-report.json
            reports/release/v0.7/summary.md

      - name: Pack tracked release evidence
        id: evidence-archive
        run: |
          set -euo pipefail
          VERSION="$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          PREPUBLISH_EVIDENCE="${{ steps.prepublish.outputs.evidence_path }}"
          EVIDENCE_ARCHIVE="$(dirname "${{ steps.pack.outputs.artifact_path }}")/goodmemory-${VERSION}-release-evidence.tar.gz"
          test -s reports/release/v0.7/v0.7.3-public-claim-governance-correction-preregistration.json
          test -s reports/release/v0.7/v0.7.3-public-claim-governance-correction-attestation.json
          test -s reports/release/v0.7/v0.7.3-stable-source-test-correction-preregistration.json
          test -s reports/release/v0.7/v0.7.3-stable-source-test-correction-attestation.json
          test -s reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-preregistration.json
          test -s reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-attestation.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$EVIDENCE_ARCHIVE" \
            -C "$(dirname "$PREPUBLISH_EVIDENCE")" "$(basename "$PREPUBLISH_EVIDENCE")" \
            -C "$GITHUB_WORKSPACE" \
            reports/release/v0.7/v0.7.3-lifecycle-protection.json \
            reports/release/v0.7/v0.7.3-lifecycle-schema9-attempt-consumed.json \
            reports/release/v0.7/v0.7.3-lifecycle-schema9-evidence \
            reports/release/v0.7/v0.7.3-full-claim-protocol2-preregistration.json \
            reports/release/v0.7/v0.7.3-full-claim-protocol2-attempt-consumed.json \
            reports/release/v0.7/v0.7.3-public-claim-governance-correction-preregistration.json \
            reports/release/v0.7/v0.7.3-public-claim-governance-correction-attestation.json \
            reports/release/v0.7/v0.7.3-stable-source-test-correction-preregistration.json \
            reports/release/v0.7/v0.7.3-stable-source-test-correction-attestation.json \
            reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-preregistration.json \
            reports/release/v0.7/v0.7.3-cross-host-lifecycle-verifier-correction-attestation.json \
            benchmark-claims/evidence/locomo-v0.7.3-current.json \
            reports/release/v0.7/v0.7.3-locomo-claim-evidence \
            reports/release/v0.7/phase-74-storage-scale-gate.json \
            reports/release/v0.7/readiness-report.json \
            reports/release/v0.7/summary.md
          test -s "$EVIDENCE_ARCHIVE"
          tar -tzf "$EVIDENCE_ARCHIVE" > /dev/null
          echo "archive_path=$EVIDENCE_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Validate npm publishing credentials
        if: startsWith(github.ref, 'refs/tags/')
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for stable tag releases"
            exit 1
          fi
          if ! NPM_USER="$(npm whoami)"; then
            echo "::error::npm authentication failed: npm whoami did not succeed"
            exit 1
          fi
          if [ -z "$NPM_USER" ]; then
            echo "::error::npm authentication failed: npm whoami returned an empty user"
            exit 1
          fi
          echo "npm_user=$NPM_USER" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          ARTIFACT_INTEGRITY="${{ steps.pack.outputs.artifact_integrity }}"
          if PUBLISHED_VERSION="$(npm view "goodmemory@${VERSION}" version 2>/dev/null)"; then
            if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
              echo "::error::npm returned unexpected version $PUBLISHED_VERSION for goodmemory@$VERSION"
              exit 1
            fi
            PUBLISHED_INTEGRITY="$(npm view "goodmemory@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [ "$PUBLISHED_INTEGRITY" != "$ARTIFACT_INTEGRITY" ]; then
              echo "::error::npm artifact identity verification failed for existing goodmemory@$VERSION"
              exit 1
            fi
            echo "goodmemory@$VERSION already exists on npm; verifying registry state."
          else
            npm publish --access public "${{ steps.pack.outputs.artifact_path }}"
          fi
          PUBLISHED_VERSION=""
          PUBLISHED_INTEGRITY=""
          LATEST_VERSION=""
          for attempt in {1..12}; do
            PUBLISHED_VERSION="$(npm view "goodmemory@${VERSION}" version 2>/dev/null || true)"
            PUBLISHED_INTEGRITY="$(npm view "goodmemory@${VERSION}" dist.integrity 2>/dev/null || true)"
            LATEST_VERSION="$(npm view goodmemory@latest version 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$LATEST_VERSION" = "$VERSION" ] && [ "$PUBLISHED_INTEGRITY" = "$ARTIFACT_INTEGRITY" ]; then
              break
            fi
            echo "Waiting for npm registry visibility for goodmemory@$VERSION (attempt $attempt/12)..."
            sleep 10
          done
          if [ "$PUBLISHED_INTEGRITY" != "$ARTIFACT_INTEGRITY" ]; then
            echo "::error::npm artifact identity verification failed: registry integrity does not match the release tarball"
            exit 1
          fi
          if [ "$PUBLISHED_VERSION" != "$VERSION" ] || [ "$LATEST_VERSION" != "$VERSION" ]; then
            echo "::error::npm registry verification failed: expected version and latest tag $VERSION, got version=${PUBLISHED_VERSION:-<empty>} latest=${LATEST_VERSION:-<empty>}"
            exit 1
          fi
          {
            echo "## npm publish"
            echo "- Verified: goodmemory@$VERSION"
            echo "- Verified dist tag: latest -> $LATEST_VERSION"
            echo "- Verified artifact integrity: $PUBLISHED_INTEGRITY"
            echo "- npm user: ${{ steps.npm-auth.outputs.npm_user }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pack.outputs.artifact_path }}
            ${{ steps.evidence-archive.outputs.archive_path }}
          prerelease: false
          make_latest: true
