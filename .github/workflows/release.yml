name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOODMEMORY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install sqlite-vss Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libatlas-base-dev liblapack-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare exact release artifacts
        id: prepare
        env:
          GOODMEMORY_ASSISTED_EXTRACTOR_API_KEY: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_API_KEY }}
          GOODMEMORY_ASSISTED_EXTRACTOR_BASE_URL: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_BASE_URL }}
          GOODMEMORY_ASSISTED_EXTRACTOR_MODEL: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_MODEL }}
          GOODMEMORY_ASSISTED_EXTRACTOR_PROVIDER: ${{ secrets.GOODMEMORY_ASSISTED_EXTRACTOR_PROVIDER }}
          GOODMEMORY_TEST_POSTGRES_URL: ${{ secrets.GOODMEMORY_TEST_POSTGRES_URL || 'postgres://postgres:postgres@localhost:5432/postgres' }}
        run: |
          set -euo pipefail
          RELEASE_OUTPUT_DIR="$RUNNER_TEMP/goodmemory-release"
          PREPARE_JSON="$(bun scripts/release.ts prepare --output-dir "$RELEASE_OUTPUT_DIR")"
          field() {
            PREPARE_JSON="$PREPARE_JSON" FIELD_NAME="$1" bun -e '
              const value = JSON.parse(process.env.PREPARE_JSON)[process.env.FIELD_NAME];
              if (typeof value !== "string" || value.length === 0) process.exit(1);
              console.log(value);
            '
          }
          ARTIFACT_PATH="$(field tarballPath)"
          ARTIFACT_INTEGRITY="$(field integrity)"
          MANIFEST_PATH="$(field manifestPath)"
          SUMMARY_PATH="$(field summaryPath)"
          ARCHIVE_PATH="$(field archivePath)"
          RELEASE_JSON="$(MANIFEST_PATH="$MANIFEST_PATH" bun -e '
            const manifest = await Bun.file(process.env.MANIFEST_PATH).json();
            console.log(JSON.stringify({
              commit: manifest.source.commit,
              distTag: manifest.package.distTag,
              status: manifest.package.status,
              tree: manifest.source.tree,
              version: manifest.package.version,
            }));
          ')"
          release_field() {
            RELEASE_JSON="$RELEASE_JSON" FIELD_NAME="$1" bun -e '
              const value = JSON.parse(process.env.RELEASE_JSON)[process.env.FIELD_NAME];
              if (typeof value !== "string" || value.length === 0) process.exit(1);
              console.log(value);
            '
          }
          SOURCE_COMMIT="$(release_field commit)"
          SOURCE_TREE="$(release_field tree)"
          VERSION="$(release_field version)"
          DIST_TAG="$(release_field distTag)"
          STATUS="$(release_field status)"
          if [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Prepared source $SOURCE_COMMIT does not match workflow source $GITHUB_SHA"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch prepares and uploads artifacts only; publication is disabled."
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$STATUS" != "stable" ]; then
            echo "::error::Tag-triggered publication requires stable source metadata"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Trigger tag $GITHUB_REF_NAME does not match prepared version $VERSION"
            exit 1
          fi
          echo "artifact_name=$(basename "$ARTIFACT_PATH")" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_integrity=$ARTIFACT_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "summary_path=$SUMMARY_PATH" >> "$GITHUB_OUTPUT"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepared release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ steps.prepare.outputs.artifact_path }}
            ${{ steps.prepare.outputs.manifest_path }}
            ${{ steps.prepare.outputs.archive_path }}

      - name: Validate npm publishing credentials
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.prepare.outputs.status == 'stable'
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for tag releases"
            exit 1
          fi
          if ! NPM_USER="$(npm whoami)"; then
            echo "::error::npm authentication failed: npm whoami did not succeed"
            exit 1
          fi
          if [ -z "$NPM_USER" ]; then
            echo "::error::npm authentication failed: npm whoami returned an empty user"
            exit 1
          fi
          echo "npm_user=$NPM_USER" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.prepare.outputs.status == 'stable'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.prepare.outputs.version }}"
          DIST_TAG="${{ steps.prepare.outputs.dist_tag }}"
          ARTIFACT_INTEGRITY="${{ steps.prepare.outputs.artifact_integrity }}"
          if PUBLISHED_VERSION="$(npm view "goodmemory@${VERSION}" version 2>/dev/null)"; then
            if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
              echo "::error::npm returned unexpected version $PUBLISHED_VERSION for goodmemory@$VERSION"
              exit 1
            fi
            PUBLISHED_INTEGRITY="$(npm view "goodmemory@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [ "$PUBLISHED_INTEGRITY" != "$ARTIFACT_INTEGRITY" ]; then
              echo "::error::npm artifact identity verification failed for existing goodmemory@$VERSION"
              exit 1
            fi
            echo "goodmemory@$VERSION already exists on npm; verifying registry state."
          else
            npm publish --access public "${{ steps.prepare.outputs.artifact_path }}" --tag "$DIST_TAG"
          fi
          PUBLISHED_VERSION=""
          PUBLISHED_INTEGRITY=""
          DIST_TAG_VERSION=""
          for attempt in {1..12}; do
            PUBLISHED_VERSION="$(npm view "goodmemory@${VERSION}" version 2>/dev/null || true)"
            PUBLISHED_INTEGRITY="$(npm view "goodmemory@${VERSION}" dist.integrity 2>/dev/null || true)"
            DIST_TAG_VERSION="$(npm view "goodmemory@${DIST_TAG}" version 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$DIST_TAG_VERSION" = "$VERSION" ] && [ "$PUBLISHED_INTEGRITY" = "$ARTIFACT_INTEGRITY" ]; then
              break
            fi
            echo "Waiting for npm registry visibility for goodmemory@$VERSION (attempt $attempt/12)..."
            sleep 10
          done
          if [ "$PUBLISHED_INTEGRITY" != "$ARTIFACT_INTEGRITY" ]; then
            echo "::error::npm artifact identity verification failed: registry integrity does not match the release tarball"
            exit 1
          fi
          if [ "$PUBLISHED_VERSION" != "$VERSION" ] || [ "$DIST_TAG_VERSION" != "$VERSION" ]; then
            echo "::error::npm registry verification failed: expected version and $DIST_TAG tag $VERSION, got version=${PUBLISHED_VERSION:-<empty>} dist-tag=${DIST_TAG_VERSION:-<empty>}"
            exit 1
          fi
          {
            echo "## npm publish"
            echo "- Verified: goodmemory@$VERSION"
            echo "- Verified dist tag: $DIST_TAG -> $DIST_TAG_VERSION"
            echo "- Verified artifact integrity: $PUBLISHED_INTEGRITY"
            echo "- npm user: ${{ steps.npm-auth.outputs.npm_user }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.prepare.outputs.status == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.prepare.outputs.artifact_path }}
            ${{ steps.prepare.outputs.manifest_path }}
            ${{ steps.prepare.outputs.archive_path }}
          prerelease: false
          make_latest: true
