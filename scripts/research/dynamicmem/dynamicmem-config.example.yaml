runtime:
  baseline: goodmemory
  experiment_name: goodmemory_sealed_pilot
  run_id: main
  resume: false
  checkpoint_workers: 1
  within_checkpoint_workers: 4
  save_every_generation_keys: 1
  enable_change_reasoning: true
  enable_rq3_apply_service_qa: true
  rq3_apply_save_prompt_and_raw: true

users:
  - 001_user_001

data:
  benchmark: /Volumes/data/GoodMemory-research/DynamicMem-data/{user_id}/task_packs.json
  app_logs_path: /Volumes/data/GoodMemory-research/DynamicMem-data/{user_id}/app_log_large.json

output:
  prediction_path: /Volumes/data/GoodMemory-research/DynamicMem-results/{user_id}/prediction/{run_name}/tce_results.json

llm:
  provider: openai
  model: gpt-5.6-terra
  max_workers: 4
  temperature: 0.0
  top_p: 1.0
  top_k: null

retriever:
  provider: openai
  model: text-embedding-3-large
  batch_size: 64

retrieval:
  top_k: 10
  rq3_apply_top_k: 10

final_qa:
  enabled: false
